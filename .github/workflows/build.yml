name: Build PocketVM APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Determine Output APK
        run: |
          mkdir -p out
          if ls app/build/outputs/apk/release/*-release.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-release.apk out/pocketvm-v2.0-release.apk
            echo "PRIMARY_APK=out/pocketvm-v2.0-release.apk" >> "$GITHUB_ENV"
          elif ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk out/pocketvm-v2.0-debug.apk
            echo "PRIMARY_APK=out/pocketvm-v2.0-debug.apk" >> "$GITHUB_ENV"
          fi
          ls -la out/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocketvm-apk
          path: out/*.apk

      - name: Upload APK to gofile.io
        id: upload_gofile
        shell: bash
        continue-on-error: true
        run: |
          APK="$PRIMARY_APK"
          if [ -f "$APK" ]; then
            NAME=$(basename "$APK")
            SIZE=$(du -h "$APK" | cut -f1)
            echo "Uploading $NAME ($SIZE) to gofile.io..."
            RESP=$(curl -s -X POST -F "file=@$APK" https://upload.gofile.io/uploadfile || true)
            echo "gofile response: $RESP"
            DOWNLOAD=$(echo "$RESP" | grep -o 'https://[^"]*download[^"]*' | head -1 || echo "")
            echo "download_link=$DOWNLOAD" >> "$GITHUB_OUTPUT"
            echo "file_size=$SIZE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          echo "Creating Release $TAG..."
          gh release create "$TAG" out/*.apk \
            --title "PocketVM v2.0.${{ github.run_number }} (Native Android Virtual Instance Host)" \
            --notes "PocketVM v2.0: High-performance native Android virtual machine container host for unprivileged Android devices. Built with Material 3, dynamic package manager, host app cloner, virtual phone desktop, and floating window support." \
            || gh release upload "$TAG" out/*.apk --clobber || true

      - name: Job Summary
        shell: bash
        run: |
          {
            echo "## 🚀 PocketVM v2.0 Build Successful"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Build Run:** \`#${{ github.run_number }}\`"
            echo "- **APK Artifacts:** Uploaded to GitHub Actions Run Artifacts & GitHub Releases"
            if [ -n "${{ steps.upload_gofile.outputs.download_link }}" ]; then
              echo "- **Direct Download Link:** ${{ steps.upload_gofile.outputs.download_link }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
